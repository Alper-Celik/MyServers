name: auto deployment

on:
  push:
    branches: ["main"]

  workflow_run:
    workflows: ["Update DNS"]
    types:
      - completed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do  cancel in-progress runs as we probably deployed older commits localy so we shouldn't rollback to old versions when we push
concurrency:
  group: "deployment"
  cancel-in-progress: true

jobs:
  updateDns-build-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      # - name: Free Disk Space (Ubuntu)
      #   uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      #   background: true
      #   with:
      #     tool-cache: true

      - name: Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        background: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Checkout
        uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31.10.5
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
            experimental-features = nix-command flakes
            accept-flake-config = true

      # - name: Restore and save Nix store
      #   uses: nix-community/cache-nix-action@v7
      #   id: nixcache
      #   with:
      #     # restore and save a cache using this key
      #     primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
      #     # if there's no cache hit, restore a cache by this prefix
      #     restore-prefixes-first-match: nix-${{ runner.os }}-
      #     # collect garbage until the Nix store size (in bytes) is at most this number
      #     # before trying to save a new cache
      #     # 1G = 1073741824
      #     gc-max-store-size-linux: 5G
      #     # do purge caches
      #     purge: true
      #     # purge all versions of the cache
      #     purge-prefixes: nix-${{ runner.os }}-
      #     # created more than this number of seconds ago
      #     purge-created: 0
      #     # or last accessed this duration (ISO 8601 duration format)
      #     # before the start of the `Post Restore and save Nix store` phase
      #     purge-last-accessed: P1DT12H
      #     # except any version with the key that is the same as the `primary-key`
      #     purge-primary-key: never
      #
      - name: update dns
        run: ./dns/update-dns.sh --doit
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}

      - wait: tailscale

      - name: install ssh key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo  "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          # Best-effort host key scan: a host being down must not fail the job.
          : > ~/.ssh/known_hosts
          for host in \
            rpi5.tailnet.alper-celik.dev \
            hetzner-server-1.devices.alper-celik.dev \
            api.projectread.ing \
            eu.nixbuild.net; do
            ssh-keyscan -T 10 "$host" >> ~/.ssh/known_hosts 2>/dev/null \
              || echo "warning: could not scan $host" >&2
          done
        env:
          SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}

      - uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.nixbuild_token }}
          generate_summary_for: "job"

      - name: build/check
        run: |
          nix build .#checks.aarch64-linux.deploy-toplevels -L  \
          --print-build-logs \
          --builders "" \
          --max-jobs 2 \
          --eval-store auto \
          --store ssh-ng://eu.nixbuild.net \

          # deploy.py's shebang runs `nix shell .#deploy-env` on the runner. That
          # buildEnv exists in no binary cache, so with max-jobs = 0 nix would hand
          # the build to the `nixbuild` builder over ssh and fail. Build it on
          # nixbuild.net here and copy it into the runner's store instead.
          nix build .#deploy-env --no-link -L \
          --print-build-logs \
          --builders "" \
          --max-jobs 2 \
          --eval-store auto \
          --store ssh-ng://eu.nixbuild.net
          nix copy --from ssh-ng://eu.nixbuild.net --no-check-sigs \
          "$(nix eval --raw .#deploy-env.outPath)"

      - name: deploy
        run: ./deploy.py deploy-ci
